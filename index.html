<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>

    <link rel="stylesheet" href="style.css">

    
</head>
<body>

    <button class="theme" onclick="changeTheme()" id="themeButton">
        <img src="images/sun.gif" alt="Change theme" id="themeIcon">
    </button>

    <main class="main">
        <div class="heading">
            <h1>ToDo App</h1>
            <p>Keep it up!</p>

            <div class="progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="counter">
            <h2 id="counter">0 / 0</h2>
        </div>
    </main>

    <div class="task">
        <input
            type="text"
            id="taskInput"
            placeholder="Write your task..."
            aria-label="Write your task"
        >

        <button class="add" onclick="addTask()" aria-label="Add task">
            +
        </button>
    </div>

    <ul id="taskList"></ul>

    <script src="script.js" type="modue"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
</body>
</html>
